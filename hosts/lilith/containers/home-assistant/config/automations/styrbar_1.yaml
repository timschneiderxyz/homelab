- id: styrbar_1
  alias: Styrbar 1
  description: Automation for the IKEA Styrbar remote control.
  mode: queued
  triggers:
    # Trigger - On
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: 'on'
      id: styrbar_1_on
    # Trigger - Brightness move up
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: brightness_move_up
      id: styrbar_1_brightness_move_up
    # Trigger - Off
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: 'off'
      id: styrbar_1_off
    # Trigger - Brightness move down
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: brightness_move_down
      id: styrbar_1_brightness_move_down
    # Trigger - Arrow left click
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: arrow_left_click
      id: styrbar_1_arrow_left_click
    # Trigger - Arrow left hold
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: arrow_left_hold
      id: styrbar_1_arrow_left_hold
    # Trigger - Arrow right click
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: arrow_right_click
      id: styrbar_1_arrow_right_click
    # Trigger - Arrow right hold
    - trigger: mqtt
      topic: "zigbee2mqtt/Styrbar 1"
      value_template: "{{ value_json.action }}"
      payload: arrow_right_hold
      id: styrbar_1_arrow_right_hold
  conditions: []
  actions:
    - choose:
        # Action - On
        - conditions:
            - condition: trigger
              id: styrbar_1_on
          sequence:
            - action: script.light_toggle
              data:
                entity_id: light.hue_color_lamp_4
                profile: bright
        # Action - Brightness move up
        - conditions:
            - condition: trigger
              id: styrbar_1_brightness_move_up
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.hue_color_lamp_4
              data:
                profile: night
        # Action - Off
        - conditions:
            - condition: trigger
              id: styrbar_1_off
          sequence:
            - action: script.light_toggle
              data:
                entity_id:
                  - light.hue_luster_2
                  - light.hue_luster_3
                  - light.hue_luster_4
                  - light.hue_go_1
                profile: bright
        # Action - Brightness move down
        - conditions:
            - condition: trigger
              id: styrbar_1_brightness_move_down
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.hue_luster_2
                  - light.hue_luster_3
                  - light.hue_luster_4
                  - light.hue_go_1
              data:
                profile: night
        # Action - Arrow left click
        - conditions:
            - condition: trigger
              id: styrbar_1_arrow_left_click
          sequence:
            - action: >-
                {% if is_state('cover.shelly_2pm_gen4_schlafzimmer', 'opening')
                   or is_state('cover.shelly_2pm_gen4_schlafzimmer', 'closing') %}
                  cover.stop_cover
                {% else %}
                  cover.open_cover
                {% endif %}
              target:
                entity_id: cover.shelly_2pm_gen4_schlafzimmer
        # Action - Arrow left hold
        - conditions:
            - condition: trigger
              id: styrbar_1_arrow_left_hold
          sequence:
        # Action - Arrow right click
        - conditions:
            - condition: trigger
              id: styrbar_1_arrow_right_click
          sequence:
            - action: >-
                {% if is_state('cover.shelly_2pm_gen4_schlafzimmer', 'opening')
                   or is_state('cover.shelly_2pm_gen4_schlafzimmer', 'closing') %}
                  cover.stop_cover
                {% else %}
                  cover.close_cover
                {% endif %}
              target:
                entity_id: cover.shelly_2pm_gen4_schlafzimmer
        # Action - Arrow right hold
        - conditions:
            - condition: trigger
              id: styrbar_1_arrow_right_hold
          sequence:
